name: oauth-server

services:
  auth-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auth-server
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: auth_user
      DB_PASSWORD: auth_pass
      DB_NAME: auth_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-key
    depends_on:
      - postgres
      - redis
    networks:
      - auth-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: auth-postgres
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - auth-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - auth-network
    restart: unless-stopped

  # 負荷試験用
  k6:
    image: grafana/k6:latest
    container_name: auth-k6
    volumes:
      - ./k6:/scripts
    working_dir: /scripts
    entrypoint: ["k6"]
    networks:
      - auth-network
    profiles:
      - test

volumes:
  postgres-data:
  redis-data:

networks:
  auth-network:
    driver: bridge
